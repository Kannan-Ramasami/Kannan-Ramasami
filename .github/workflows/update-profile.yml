name: Refresh profile activity

on:
  workflow_dispatch:
  schedule:
    # Hourly refresh; scheduled runs may be delayed by GitHub.
    - cron: "23 * * * *"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "scripts/update_activity.py"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-readme-refresh
  cancel-in-progress: true

jobs:
  update-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh recent public activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_activity.py

      - name: Commit and push if README changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No README changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh profile activity"
          git push
